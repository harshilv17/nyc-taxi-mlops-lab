# CD (S0, blue-green from S3): after `ci` succeeds on a push to main, deploy that commit's app image to the
# idle colour on the app host, check it there, and switch traffic to it. The old colour keeps running,
# so rolling back is a switch, not a deploy (.github/workflows/rollback.yaml).
#
# What triggers the switch (decisions/011): automatic, once the idle colour passes every check below,
# each pinned to that colour through Traefik (X-Lab-Color): deploy/web.sh smoke (/version is this
# commit, /predict answers), image_tag is this commit, /predict quotes a positive duration, and an
# invalid zone is rejected with 422. Which colour is live is kept in the Traefik volume, not in the repo.
#
# Runs on the app host's self-hosted runner (label lab-app) with its instance profile; GHCR pulls use
# GITHUB_TOKEN (decisions/002). Deploys by full-SHA tag (decisions/003).
#
# workflow_run, not pull_request: the guard below rejects runs from forks and from PRs, so nobody
# else's code ever reaches this host (make check enforces the guard). workflow_dispatch (S5: a burst of
# deploys, `gh workflow run cd.yaml`) deploys main's HEAD; only people with write access can start it.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: app-colours  # shared with rollback.yaml: never deploy and switch back at the same time
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, lab-app]
    timeout-minutes: 15
    env:
      GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      LLM_HOST: ${{ vars.LLM_HOST }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to the idle colour
        id: deploy
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare  # network, Traefik volume and routes, Traefik with this stack's config
          live=$(deploy/web.sh live)
          idle=$([[ $live == blue ]] && echo green || echo blue)
          # The live colour keeps the tag it runs; only the idle one gets this commit.
          BLUE_TAG=$(deploy/web.sh tag blue)
          GREEN_TAG=$(deploy/web.sh tag green)
          if [[ $idle == blue ]]; then BLUE_TAG=$GIT_SHA; else GREEN_TAG=$GIT_SHA; fi
          export BLUE_TAG GREEN_TAG
          echo "live: $live -> deploying $GIT_SHA to $idle (blue=$BLUE_TAG green=$GREEN_TAG)"
          docker compose -f deploy/compose.web.yaml pull "app-$idle"
          # --remove-orphans: the first deploy with this stack replaces S0's single `app` container.
          # --force-recreate: every deploy is a fresh container, even when the idle colour already runs this image.
          docker compose -f deploy/compose.web.yaml up -d --wait --no-deps --remove-orphans --force-recreate "app-$idle"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "idle=$idle" >> "$GITHUB_OUTPUT"

      - name: Check the idle colour
        env:
          IDLE: ${{ steps.deploy.outputs.idle }}
        run: |
          deploy/web.sh smoke "$IDLE" "$GIT_SHA"  # /version is this commit, /predict answers
          web=http://127.0.0.1
          v=$(curl -fsS -H "X-Lab-Color: $IDLE" "$web/version")
          jq -e --arg sha "$GIT_SHA" '.image_tag == $sha' <<<"$v" >/dev/null ||
            { echo "$IDLE runs image $(jq -r .image_tag <<<"$v"), expected $GIT_SHA" >&2; exit 1; }
          p=$(curl -fsS -H "X-Lab-Color: $IDLE" "$web/predict" -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}')
          jq -e '.duration_minutes > 0' <<<"$p" >/dev/null || { echo "no positive quote: $p" >&2; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Lab-Color: $IDLE" "$web/predict" -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 9999, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}')
          echo "$IDLE /predict with an invalid zone: $code"
          [[ $code == 422 ]]

      - name: Switch traffic to it
        env:
          IDLE: ${{ steps.deploy.outputs.idle }}
        run: |
          deploy/web.sh switch "$IDLE"
          # Confirm riders now get this commit (Traefik reloads the file within a few seconds).
          for _ in $(seq 1 15); do
            sha=$(curl -fsS -m 3 http://127.0.0.1/version | jq -r .git_sha) || sha=
            [[ $sha == "$GIT_SHA" ]] && { echo "live: $IDLE on $GIT_SHA"; exit 0; }
            sleep 2
          done
          echo "traffic still answers with ${sha:-nothing}, expected $GIT_SHA" >&2
          exit 1

      - name: Status
        if: always()
        run: deploy/web.sh status
