# S0 CI: `make check` on every push and pull request; on main, build the linux/arm64 app image and
# push it to GHCR with GITHUB_TOKEN (decisions/003-image-tag-scheme.md).
#
# Runs on GitHub-hosted runners only. Never put a self-hosted job in this file: it triggers on
# pull_request, and a fork's PR would run on your host (make check enforces this).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: make check

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          # Full SHA: what CD deploys and rollbacks point at (image_tag == git_sha). sha-<7>: the same
          # image under a name people can type. main: moves to the newest build; nothing deploys it.
          tags: |
            ${{ steps.img.outputs.prefix }}/app:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.sha_tag }}
            ${{ steps.img.outputs.prefix }}/app:main
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
